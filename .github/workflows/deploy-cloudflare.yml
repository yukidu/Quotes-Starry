name: Deploy quotes.starry.phd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify static assets
        shell: bash
        run: |
          set -euo pipefail
          node --check app-config.js
          node --check platform.js
          node --check starry-auth.js
          node --check scripts/build-static.mjs
          node scripts/build-static.mjs
          test -s dist/index.html
          grep -q 'window.StarryConfig' dist/index.html
          grep -q 'window.StarryPlatform' dist/index.html
          grep -q 'window.StarryIdentity' dist/index.html
          grep -q 'Starry ID 登入' dist/index.html
          grep -q '歡迎你' dist/index.html
          ! grep -q 'src="./app-config.js"' dist/index.html
          ! grep -q 'src="./platform.js"' dist/index.html
          ! grep -q 'src="./starry-auth.js"' dist/index.html
          ! grep -q 'nameModal' dist/index.html
          ! grep -q 'better_you_user_name' dist/index.html
          ! grep -q '寄送人：好友' dist/index.html

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
