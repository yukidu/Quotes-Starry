name: Deploy quotes.starry.phd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify static assets
        shell: bash
        run: |
          set -euo pipefail
          node --check app-config.js
          node --check platform.js
          node --check starry-ui.js
          node --check scripts/build-static.mjs
          node --check scripts/fit-answer-overlay.mjs
          node scripts/build-static.mjs
          node scripts/fit-answer-overlay.mjs
          test -s dist/index.html
          grep -q 'window.StarryConfig' dist/index.html
          grep -q 'window.StarryPlatform' dist/index.html
          grep -q 'window.StarryUI' dist/index.html
          grep -q 'starry-topbar' dist/index.html
          grep -q 'starry-confirm-card' dist/index.html
          grep -q 'starry-modal-responsive' dist/index.html
          grep -q 'starry-modal-nav-sync' dist/index.html
          grep -q '#recordModal' dist/index.html
          grep -q '#installModal' dist/index.html
          grep -q '#shakeTutorialModal' dist/index.html
          grep -q '#photoZoomOverlay' dist/index.html
          grep -q 'getBoundingClientRect().height' dist/index.html
          grep -q '歡迎你' dist/index.html
          grep -q 'getDisplayName' dist/index.html
          ! grep -q 'src="./app-config.js"' dist/index.html
          ! grep -q 'src="./platform.js"' dist/index.html
          ! grep -q 'src="./starry-ui.js"' dist/index.html
          ! grep -q 'nameModal' dist/index.html
          ! grep -q 'better_you_user_name' dist/index.html
          ! grep -q '寄送人：好友' dist/index.html
          ! grep -Fq 'if (!confirm(' dist/index.html

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Quotes and Starry ID production integration
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          user_agent='Mozilla/5.0 StarryQuotesProductionSmoke/1.0'
          echo 'Waiting for production propagation...'
          sleep 10

          for attempt in $(seq 1 18); do
            echo "Production verification attempt ${attempt}/18"
            nonce="${GITHUB_SHA}-${attempt}"
            quotes_ok=0
            login_ok=0
            identity_ok=0

            if curl -A "${user_agent}" --connect-timeout 5 --max-time 15 -fsS \
              "https://quotes.starry.phd/?smoke=${nonce}" -o /tmp/quotes.html; then
              if grep -q 'https://id.starry.phd' /tmp/quotes.html \
                && grep -q '/api/apps/quotes/identity' /tmp/quotes.html \
                && grep -q '/auth/quotes' /tmp/quotes.html \
                && grep -q 'window.StarryUI' /tmp/quotes.html \
                && grep -q 'starry-topbar' /tmp/quotes.html \
                && grep -q 'starry-confirm-card' /tmp/quotes.html \
                && grep -q 'starry-modal-responsive' /tmp/quotes.html \
                && grep -q 'starry-modal-nav-sync' /tmp/quotes.html \
                && grep -q '#recordModal' /tmp/quotes.html \
                && grep -q '#installModal' /tmp/quotes.html \
                && grep -q '#shakeTutorialModal' /tmp/quotes.html \
                && grep -q '歡迎你' /tmp/quotes.html \
                && ! grep -q 'nameModal' /tmp/quotes.html \
                && ! grep -q 'better_you_user_name' /tmp/quotes.html \
                && ! grep -q '寄送人：好友' /tmp/quotes.html \
                && ! grep -Fq 'if (!confirm(' /tmp/quotes.html; then
                quotes_ok=1
              fi
            fi

            if curl -A "${user_agent}" --connect-timeout 5 --max-time 15 -fsS \
              "https://id.starry.phd/auth/quotes?smoke=${nonce}" -o /tmp/quotes-login.html; then
              if grep -q 'Starry ID × 繁星語錄' /tmp/quotes-login.html \
                && grep -q 'IDENTITY_ONLY=true' /tmp/quotes-login.html \
                && grep -q 'https://quotes.starry.phd' /tmp/quotes-login.html; then
                login_ok=1
              fi
            fi

            if curl -A "${user_agent}" --connect-timeout 5 --max-time 15 -fsS \
              -D /tmp/identity.headers \
              -H 'Accept: application/json' \
              -H 'Origin: https://quotes.starry.phd' \
              "https://id.starry.phd/api/apps/quotes/identity?smoke=${nonce}" -o /tmp/identity.json; then
              tr -d '\r' < /tmp/identity.headers > /tmp/identity.headers.clean
              if node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/identity.json','utf8')); if(x.authenticated!==false) process.exit(1)" \
                && grep -Eqi '^access-control-allow-origin: https://quotes\.starry\.phd$' /tmp/identity.headers.clean \
                && grep -Eqi '^access-control-allow-credentials: true$' /tmp/identity.headers.clean; then
                identity_ok=1
              fi
            fi

            echo "quotes=${quotes_ok}, login=${login_ok}, identity=${identity_ok}"
            if [ "${quotes_ok}" = 1 ] && [ "${login_ok}" = 1 ] && [ "${identity_ok}" = 1 ]; then
              echo 'Quotes + Starry ID production integration verified successfully.'
              exit 0
            fi
            sleep 5
          done

          echo 'Production integration verification failed after all retries.' >&2
          exit 1
